[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="heart-ai-translational"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","joblib>=1.4,<2","matplotlib>=3.9,<4","numpy>=1.26,<3","pandas>=2.2,<3","pydantic>=2.8,<3","requests>=2.32,<3","scikit-learn>=1.5,<2","streamlit>=1.38,<2","uvicorn[standard]>=0.30,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
[tool.ruff]
line-length=100
target-version="py311"
[tool.setuptools.packages.find]
where=["src"]
