services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data:ro"]
    command: uvicorn heart_ai.api:app --host 0.0.0.0 --port 8000
  web:
    build: .
    ports: ["8501:8501"]
    environment: ["API_URL=http://api:8000"]
    volumes: ["./data:/app/data:ro"]
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    depends_on: [api]
